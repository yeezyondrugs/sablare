    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap"

    />
    <link rel="stylesheet" href="css/style.css" />

    <script defer src="js/language.js"></script>

    <script>
      const base = document.querySelector("base");
      const ruRoot = base && new URL("ru/", base.href).pathname;
      if (ruRoot && location.pathname.startsWith(ruRoot)) {
        document.documentElement.lang = "ru";
        base.href = ruRoot;
      }
    </script>
